<!DOCTYPE html>
<html>
<head lang="en">

    <meta charset="UTF-8">
	<title>Save The Bales!</title>
	<link rel="icon" href="./bale_icon.png">
	<style>
		body, html {
			border: 0;
			padding: 0;
			margin: 0;
			overflow: hidden;
			font-family: sans-serif;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
		#shaders
		{
			position: absolute;
			left:0%;
			top: 0%;
			height: 100%;
			width: 40%;
			display: none;
		}
		#vshader, #fshader
		{
			height: 47%;
			width: 100%;
			overflow-x: scroll;
			overflow-y: scroll;
			border: 1px solid black;
		}

		/* Game Over Overlay */
		#gameOverOverlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.7);
			display: none; /* Hidden by default */
			justify-content: center;
			align-items: center;
			flex-direction: column;
			color: white;
			z-index: 1000;
		}

		#gameOverBox {
			background-color: #222;
			padding: 40px;
			border-radius: 15px;
			text-align: center;
			border: 4px solid #888;
			box-shadow: 0 0 20px rgba(0,0,0,0.8);
		}

		#gameOverBox h1 {
			margin-top: 0;
			color: #ff4444;
			font-size: 3em;
			text-transform: uppercase;
		}

		#gameOverBox p {
			font-size: 1.5em;
			margin: 10px 0;
		}

		#restartButton {
			margin-top: 20px;
			padding: 10px 20px;
			font-size: 1.2em;
			font-weight: bold;
			cursor: pointer;
			background-color: #4CAF50;
			color: white;
			border: none;
			border-radius: 5px;
		}
		#restartButton:hover {
			background-color: #45a049;
		}
	</style>

	
</head>

<body>
		
		<script type="module" src="./main.js"></script>

		<!-- Game Over Screen -->
		<div id="gameOverOverlay">
			<div id="gameOverBox">
				<h1>Game Over</h1>
				<p>Final Score: <span id="finalScore">0</span></p>
				<p>Saved Bales: <span id="finalBales">0</span></p>
				<button id="restartButton" onclick="location.reload()">Play Again</button>
			</div>
		</div>

		<div id="shaders">
			Vertex Shader (VS)
			<div id="vshader">
				(loading...)
			</div>
			Fragment Shader (FS)
			<div id="fshader">				
				(loading...)
			</div>
		</div>	
</body>
</html>
